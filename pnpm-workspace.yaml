packages:
  - docs
  - packages/**
  - '!packages/nuxi'
  - '!packages/test-utils'
  - '!packages/nuxt/test/package-fixture/pkg'
  - playground
  - test/fixtures/*
  - test/fixtures/*/_local-modules/*

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - oxc-resolver
  - unrs-resolver

patchedDependencies:
  changelogen: patches/changelogen.patch

publicHoistPattern:
  - '*-loader'
  - 'webpack-*'

shellEmulator: true

verifyDepsBeforeRun: install

ignoreWorkspaceCycles: true

overrides:
  "@nuxt/kit": "workspace:*"
  "@nuxt/nitro-server": "workspace:*"
  "@nuxt/rspack-builder": "workspace:*"
  "@nuxt/schema": "workspace:*"
  "@nuxt/vite-builder": "workspace:*"
  "@nuxt/webpack-builder": "workspace:*"
  "@vue/compiler-core": "3.5.34"
  "@vue/compiler-dom": "3.5.34"
  "@vue/shared": "3.5.34"
  nuxt: "workspace:*"
  send: ">=1.2.1"
  vite: "8.0.10"
  vue: "3.5.34"
  'minimatch@>=3.0.0 <3.1.4': '^3.1.4' # lockwright: GHSA-23c5-xmqv-rm74, GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-g3hv-75wg-m249
  'minimatch@>=9.0.0 <10.0.0': '^11.0.1' # lockwright: GHSA-23c5-xmqv-rm74, GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-g3hv-75wg-m249
  'minimatch@>=10.0.0 <11.0.0': '^11.0.1' # lockwright: GHSA-23c5-xmqv-rm74, GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-g3hv-75wg-m249
